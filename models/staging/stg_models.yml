version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['Shipped', 'Complete', 'Processing', 'Cancelled', 'Returned']

  - name: stg_order_items
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

  - name: stg_users
    columns:
      - name: user_id
        data_tests:
          - unique
          - not_null
     

  - name: stg_products
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
     
 
  - name: stg_events
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
     